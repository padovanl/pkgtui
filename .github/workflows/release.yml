name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Tags are meant to be cut from main only (development happens on
  # develop/feature branches). This refuses the release if someone tags a
  # commit that never made it into main.
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure tag points at a commit on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not on main; merge to main before tagging a release."
            exit 1
          fi

  goreleaser:
    needs: check-branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # Builds the linux amd64/arm64 binaries, the .tar.gz archives, the
      # .deb packages (via the nfpm integration in .goreleaser.yaml) and
      # creates the GitHub Release with all of it attached.
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  snap:
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - uses: actions/checkout@v4

      # Builds snap/snapcraft.yaml (classic confinement) for amd64.
      - uses: snapcore/action-build@v1
        id: build

      - name: Rename snap artifact
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv "${{ steps.build.outputs.snap }}" "pkgtui_${version}_amd64.snap"
          echo "SNAP_FILE=pkgtui_${version}_amd64.snap" >> "$GITHUB_ENV"

      - name: Attach snap to the release created by goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "${SNAP_FILE}" --clobber --repo "${GITHUB_REPOSITORY}"
