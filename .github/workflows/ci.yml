name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - run: gofmt -l . | tee /tmp/fmt.out && test ! -s /tmp/fmt.out
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      # Builds its own binary and drives it through a real pty (see
      # e2e/e2e_test.go); excluded from the plain `go test ./...` above
      # via its build tag, run as its own step so a failure here is easy
      # to tell apart from a unit test failure in the log.
      - run: go vet -tags e2e ./e2e/...
      - run: go test -tags e2e ./e2e/... -v
