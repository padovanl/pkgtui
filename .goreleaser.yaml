version: 2

project_name: pkgtui

before:
  hooks:
    - go mod tidy

builds:
  - id: pkgtui
    main: .
    binary: pkgtui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

  # macOS, once Homebrew/MacPorts became backends of their own: an Intel
  # and an Apple Silicon build, both from the same pure-Go source (nothing
  # here needs cgo, so they cross-compile from the Linux release runner).
  # Kept as a separate build id so the .deb below can name the Linux one
  # explicitly instead of trying to package a Mach-O binary.
  - id: pkgtui-darwin
    main: .
    binary: pkgtui
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: pkgtui-archive
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

nfpms:
  - id: pkgtui-deb
    ids:
      - pkgtui # the Linux build only: a .deb of a darwin binary is nonsense
    package_name: pkgtui
    file_name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Arch }}
    vendor: pkgtui
    homepage: https://github.com/padovanl/pkgtui
    maintainer: padovanl
    description: |-
      An htop-style terminal UI (TUI) to search, install, remove and
      upgrade packages, with a tab per package manager found on the system
      (apt, snap, flatpak).
    license: MIT
    formats:
      - deb
    section: utils
    priority: optional
    recommends:
      - snapd
    # Suggests, not recommends: pkgtui grows a flatpak tab if flatpak is
    # there, but installing pkgtui is no reason to pull a second package
    # system onto a machine that doesn't already use one.
    suggests:
      - flatpak
    contents:
      - src: ./README.md
        dst: /usr/share/doc/pkgtui/README.md
      - src: ./assets/pkgtui.desktop
        dst: /usr/share/applications/pkgtui.desktop
      - src: ./assets/icon.svg
        dst: /usr/share/icons/hicolor/scalable/apps/pkgtui.svg
    scripts:
      postinstall: ./scripts/deb/postinstall.sh
      postremove: ./scripts/deb/postremove.sh

# What a macOS user actually expects: "brew install pkgtui", not a curl
# and a tar. A cask rather than a formula because that's what Homebrew now
# uses for a plain prebuilt binary — and because casks clear the Gatekeeper
# quarantine attribute themselves, which an unsigned, un-notarized binary
# otherwise trips over on first run.
#
# The tap lives in this same repo (Casks/ on main) instead of a separate
# padovanl/homebrew-tap: that needs no second repository and no personal
# access token, since the release workflow's own GITHUB_TOKEN can already
# write here. The cost is one extra line for the user, who has to name the
# repo when tapping it (Homebrew only infers the URL for repos called
# homebrew-*). Moving to a dedicated tap later is a change of owner/name
# below plus a token in the workflow.
homebrew_casks:
  - name: pkgtui
    repository:
      owner: padovanl
      name: pkgtui
      branch: main
    directory: Casks
    binaries: [pkgtui]
    homepage: https://github.com/padovanl/pkgtui
    description: htop-style terminal UI for apt, snap, flatpak, Homebrew and MacPorts packages
    license: MIT

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: padovanl
    name: pkgtui
  draft: false
  prerelease: auto
