name: pkgtui
base: core22
# The version is set dynamically from `git describe` by the pkgtui part's
# override-pull below (adopt-info), so it never goes stale across releases.
adopt-info: pkgtui
title: pkgtui
summary: An htop-style TUI to search/install/remove apt and snap packages
description: |
  pkgtui is a terminal UI (TUI) in the style of htop for searching,
  installing, removing and upgrading apt and snap packages from a single
  dashboard, without having to remember the syntax of either package manager.

  This snap uses "classic" confinement because pkgtui needs to invoke
  apt-get/dpkg/snap on the host system to do its job. It is not meant to be
  published on the Snap Store, but installed locally with:

    snap install --dangerous --classic pkgtui_<version>_<arch>.snap
contact: https://github.com/padovanl/pkgtui/issues
issues: https://github.com/padovanl/pkgtui/issues
source-code: https://github.com/padovanl/pkgtui
website: https://github.com/padovanl/pkgtui
license: MIT
icon: assets/icon.svg

grade: stable
confinement: classic

apps:
  pkgtui:
    command: bin/pkgtui
    desktop: assets/pkgtui.desktop

parts:
  pkgtui:
    plugin: go
    source: .
    build-snaps:
      - go/1.24/stable
    # pkgtui is a statically linked Go binary (CGO_ENABLED=0): it has no
    # shared library dependencies for patchelf to fix up, so skip it to
    # silence the classic-confinement ELF interpreter/rpath lint warnings.
    build-attributes:
      - no-patchelf
    override-pull: |
      craftctl default
      craftctl set version="$(git -C "$CRAFT_PART_SRC" describe --tags --always --dirty)"
    # The go plugin only installs the built binary; the app's `desktop:`
    # entry above expects the .desktop file at this same relative path
    # inside the packed snap (not the source tree), so it has to be
    # copied in explicitly.
    override-build: |
      craftctl default
      install -D assets/pkgtui.desktop "$CRAFT_PART_INSTALL/assets/pkgtui.desktop"
