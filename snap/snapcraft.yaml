name: pkgtui
base: core22
version: "0.1.0"
summary: An htop-style TUI to search/install/remove apt and snap packages
description: |
  pkgtui is a terminal UI (TUI) in the style of htop for searching,
  installing, removing and upgrading apt and snap packages from a single
  dashboard, without having to remember the syntax of either package manager.

  This snap uses "classic" confinement because pkgtui needs to invoke
  apt-get/dpkg/snap on the host system to do its job. It is not meant to be
  published on the Snap Store, but installed locally with:

    snap install --dangerous --classic pkgtui_<version>_<arch>.snap

grade: stable
confinement: classic

apps:
  pkgtui:
    command: bin/pkgtui

parts:
  pkgtui:
    plugin: go
    source: .
    build-snaps:
      - go/1.24/stable
